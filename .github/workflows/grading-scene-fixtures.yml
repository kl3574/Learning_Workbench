name: Grading two-profile scene separate finite fixture budget validation
on:
  push:
    branches:
      - qa/M6.3-grading-scene-fixtures
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grading-scene:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/qa/M6.3-grading-scene-fixtures' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify reviewed parent and unchanged product and test context
        run: |
          git log -1 --format=%H
          git rev-parse HEAD^
          test "$(git rev-parse HEAD^)" = "fb26ad47e47f66e592c237c90f117d45e92fd1df"
          git diff --exit-code fb26ad47e47f66e592c237c90f117d45e92fd1df -- . ':(exclude)tests/e2e/grading.spec.ts' ':(exclude).github/workflows/grading-scene-fixtures.yml' ':(exclude)progress/evidence/2026-10-09/M6.3-fb26-actual-complete-baseline-FAIL.json' ':(exclude)progress/evidence/2026-10-09/M6.3-fb26-grading-current-artifact-audit.json' ':(exclude)progress/evidence/2026-10-09/M6.3-fb26-grading-current-source-diagnosis.json' ':(exclude)progress/evidence/2026-10-09/M6.3-grading-scene-fixture-budget-candidate.json' ':(exclude)progress/evidence/2026-10-09/M6.3-grading-scene-fixture-budget-standards-review.json' ':(exclude)progress/evidence/2026-10-09/M6.3-grading-scene-fixture-budget-spec-review.json'
          test "$(git rev-parse HEAD:tests/e2e/grading.spec.ts)" = "6218a571a38a91f71e5e955b005d3e04a6db0248"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - name: Install fixed official Ubuntu document sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap=0.11.1-1ubuntu0.3 apparmor=5.0.2-0ubuntu1~26.04.1 libapparmor1=5.0.2-0ubuntu1~26.04.1 libseccomp2=2.6.0-2ubuntu5
          dpkg-query -W bubblewrap apparmor libapparmor1 libseccomp2
          test -f /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: make build
      - name: Run the unchanged grading assertions with only finite fixture budgets separated
        id: scene
        run: |
          bash scripts/node.sh npm --prefix apps/web run test:e2e -- tests/e2e/grading.spec.ts --grep 'two browser profiles keep a stale manual-review baseline through an actual 412 before explicit three-way rebase$' --retries=0
        env:
          LEARNING_E2E_OUTPUT_DIR: ${{ runner.temp }}/learning-workbench-grading-scene-results
      - name: Retain bounded synthetic grading timing and failure diagnostics
        if: ${{ always() && (steps.scene.outcome == 'success' || steps.scene.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grading-scene-outcome-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/learning-workbench-grading-scene-results/**/grading-two-profile-timing.json
            ${{ runner.temp }}/learning-workbench-grading-scene-results/**/test-failed*.png
            ${{ runner.temp }}/learning-workbench-grading-scene-results/**/error-context.md
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
