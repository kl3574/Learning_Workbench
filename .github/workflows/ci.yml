name: Implemented baseline checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spec-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: npm ci --prefix apps/web
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - run: make verify-spec
      - run: uv run --frozen pytest tests/contract tests/unit/test_spec_*.py
  backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - name: Install fixed official Ubuntu document sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap=0.11.1-1ubuntu0.1 apparmor=5.0.2-0ubuntu1~26.04.1 libapparmor1=5.0.2-0ubuntu1~26.04.1 libseccomp2=2.6.0-2ubuntu5
          dpkg-query -W bubblewrap apparmor libapparmor1 libseccomp2
          test -f /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - name: Probe fixed synthetic document runtime
        run: uv run --frozen python scripts/probe_document_sandbox.py
      - run: uv run --frozen pytest tests/unit tests/security
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run test
      - run: make build
  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - name: Install fixed official Ubuntu document sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap=0.11.1-1ubuntu0.1 apparmor=5.0.2-0ubuntu1~26.04.1 libapparmor1=5.0.2-0ubuntu1~26.04.1 libseccomp2=2.6.0-2ubuntu5
          dpkg-query -W bubblewrap apparmor libapparmor1 libseccomp2
          test -f /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
      - run: uv run --frozen pytest tests/integration
  browser:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen
      - name: Install fixed official Ubuntu document sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap=0.11.1-1ubuntu0.1 apparmor=5.0.2-0ubuntu1~26.04.1 libapparmor1=5.0.2-0ubuntu1~26.04.1 libseccomp2=2.6.0-2ubuntu5
          dpkg-query -W bubblewrap apparmor libapparmor1 libseccomp2
          test -f /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: make build
      - run: make test-e2e
  security-publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - run: python scripts/check_publication.py --all-tracked
